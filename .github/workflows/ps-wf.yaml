name: Apigee Platform CI

on:
  workflow_dispatch:

  push:
    branches:
      - feature-adarsha
      - release

jobs:
  deploy:
    uses: ForgeCrux/pipeline-template/.github/workflows/apigee-v1.yaml@main
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      apigee_org: gen-ai-poc-onboarding
      apigee_env: dev
      deploy_proxy: audit-api
      resourcetype: apis
      branch_name: ${{ github.ref_name }}
